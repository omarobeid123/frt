<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اسواق تجربة</title>

<style>
body{font-family:Arial;margin:0;padding-bottom:60px;background:#f7f7f7}
#jsonStatus{
    position:fixed;
    top:16px;
    left:50%;
    transform:translateX(-50%);
    padding:10px 18px;
    border-radius:10px;
    font-weight:800;
    z-index:10000;
    display:none;
    box-shadow:0 8px 22px rgba(0,0,0,.15);
}
.product-popup{
    position:fixed;
    bottom:90px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    padding:12px 16px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
    display:none;
    z-index:9999;
}
.product-popup.show{display:block}
</style>
</head>

<body>

<div id="jsonStatus"></div>

<h3 style="text-align:center;margin:12px">📷 وجه الكاميرا نحو الباركود</h3>

<video id="barcodeVideo" autoplay playsinline muted
       style="width:100%;max-width:420px;margin:auto;display:block;border-radius:14px"></video>

<canvas id="barcodeCanvas" style="display:none"></canvas>

<div id="barcodeResult"
     style="margin:12px auto;max-width:420px;background:#fff;
     padding:12px;border-radius:10px;text-align:center;font-weight:800">
</div>

<div id="productPopup" class="product-popup">
    <div id="popupName"></div>
    <div id="popupPrice" style="color:#c00;font-weight:900"></div>
</div>

<script>
(function(){

const CLOUDINARY_JSON_URL =
 'https://res.cloudinary.com/bwabtak/raw/upload/v1767405761/_byleqs.json';

const video = document.getElementById('barcodeVideo');
const canvas = document.getElementById('barcodeCanvas');
const ctx = canvas.getContext('2d');
const resultEl = document.getElementById('barcodeResult');

let detector = null;
let stream = null;
let productsCache = null;

/* ---------- UI ---------- */
function showJsonStatus(msg, ok=true){
    const el = document.getElementById('jsonStatus');
    el.textContent = msg;
    el.style.background = ok ? '#e6fff3' : '#ffe6e6';
    el.style.color = ok ? '#0b8b73' : '#b00020';
    el.style.display = 'block';
    setTimeout(()=>el.style.display='none',4000);
}

function normalizeDigits(v){
    return String(v||'').replace(/[^\d]/g,'');
}

/* ---------- LOAD JSON ---------- */
async function ensureProducts(){
    if(productsCache) return productsCache;

    try{
        const res = await fetch(CLOUDINARY_JSON_URL,{cache:'no-store'});
        if(!res.ok) throw new Error('HTTP '+res.status);

        const json = await res.json();

        if(Array.isArray(json)){
            productsCache = { products: json };
        }else if(json && Array.isArray(json.products)){
            productsCache = json;
        }else{
            throw new Error('صيغة غير مدعومة');
        }

        showJsonStatus(`تم تحميل ${productsCache.products.length} منتج بنجاح`,true);

    }catch(e){
        console.error(e);
        productsCache = { products: [] };
        showJsonStatus('❌ فشل تحميل ملف المنتجات',false);
    }

    return productsCache;
}

/* ---------- BARCODE ---------- */
async function createDetector(){
    if('BarcodeDetector' in window && !detector){
        detector = new BarcodeDetector({
            formats:['ean_13','code_128','upc_a','upc_e']
        });
    }
}

async function lookupBarcode(code){
    const list = (await ensureProducts()).products;
    const scanned = normalizeDigits(code);

    for(const p of list){
        const pc = normalizeDigits(p.barcode);
        if(!pc) continue;

        if(pc === scanned || pc.endsWith(scanned) || scanned.endsWith(pc)){
            return p;
        }
    }
    return null;
}

function showProduct(p){
    const popup = document.getElementById('productPopup');
    document.getElementById('popupName').textContent = p.name;
    document.getElementById('popupPrice').textContent = p.price + ' د.أ';
    popup.classList.add('show');
    setTimeout(()=>popup.classList.remove('show'),4000);
}

/* ---------- CAMERA ---------- */
async function startCamera(){
    stream = await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'environment'}
    });
    video.srcObject = stream;
}

async function scan(){
    if(!video.videoWidth) return;
    await createDetector();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video,0,0);

    if(detector){
        const codes = await detector.detect(canvas);
        if(codes.length){
            const code = codes[0].rawValue;
            resultEl.textContent = code;

            const product = await lookupBarcode(code);
            if(product){
                showProduct(product);
            }else{
                resultEl.textContent = '❌ لا يوجد منتج';
            }
        }
    }
}

/* ---------- INIT ---------- */
startCamera();
ensureProducts();

setInterval(scan,800);

})();
</script>

</body>
</html>
